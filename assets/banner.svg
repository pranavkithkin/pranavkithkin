<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pranav Satheesan, Founder and CEO, Synops Labs LLC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#12101f"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#4c1d95" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wave1" x1="0" y1="260" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4c1d95"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="300" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.5" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="name" x1="480" y1="150" x2="1120" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9d5ff"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="rule" x1="640" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect width="1600" height="420" fill="url(#glow)"/>

  <g stroke="#a78bfa" stroke-opacity="0.10">
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="1400" y1="0" x2="1400" y2="420"/>
    <line x1="0" y1="60" x2="1600" y2="60"/>
  </g>

  <g opacity="0.5">
    <path d="M-200 340 C 60 290, 260 390, 520 350 C 780 310, 980 400, 1240 360 C 1440 330, 1640 380, 1800 350 L 1800 420 L -200 420 Z" fill="url(#wave2)">
      <animateTransform attributeName="transform" type="translate" values="0 0; -90 0; 0 0" dur="16s" repeatCount="indefinite"/>
    </path>
  </g>
  <g opacity="0.85">
    <path d="M-200 375 C 40 335, 300 415, 560 385 C 820 355, 1060 425, 1320 390 C 1520 365, 1680 405, 1800 385 L 1800 420 L -200 420 Z" fill="url(#wave1)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 70 0; 0 0" dur="12s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="800" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="14" fill="url(#name)">PRANAV SATHEESAN</text>

  <rect x="640" y="186" width="320" height="2" fill="url(#rule)"/>

  <text x="800" y="232" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="7" fill="#a78bfa">FOUNDER &amp; CEO | SYNOPS LABS LLC</text>

  <text x="800" y="278" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing="5" fill="#8b8fa3">FULL STACK ENGINEER · AI SYSTEMS · DUBAI, UAE</text>
</svg>
